<!DOCTYPE html>
<html>
<head>
  <title>GenLayer Spinner · Contract Tool</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>GenLayer Spinner</h1>
    <p class="subtitle">Intelligent Contract Deployment Tool</p>
    
    <div class="spinner-wrapper">
      <!-- Raw spinner SVG from previous submission -->
      <div id="spinner" class="gl-spinner-container">
        <svg class="gl-spinner" viewBox="0 0 100 100">
          <!-- SVG content from previous submission -->
        </svg>
      </div>
    </div>

    <div id="statusDisplay" class="status">Status: IDLE</div>
    
    <div class="controls">
      <button id="spinBtn" class="btn primary">Deploy Spin</button>
      <button id="stopBtn" class="btn secondary">Stop</button>
    </div>

    <div class="info">
      <p>Contract deployed to GenLayer network</p>
      <small>0x1234...abcd</small>
    </div>
  </div>

  <script src="https://cdn.ethers.io/lib/ethers-5.7.2.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
