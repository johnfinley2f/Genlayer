<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GenLayer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #000;
    overflow: hidden;
  }

  #loader {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
    z-index: 100;
    transition: opacity 0.7s ease, visibility 0.7s ease;
  }

  #loader.hidden {
    opacity: 0;
    visibility: hidden;
  }

  .logo-wrap {
    position: relative;
    width: 80px;
    height: 80px;
  }

  .logo {
    width: 80px;
    height: 80px;
    color: #fff;
    animation: logo-pulse 1.4s ease-in-out infinite;
  }

  @keyframes logo-pulse {
    0%, 100% { opacity: 1;   transform: scale(1); }
    50%       { opacity: 0.6; transform: scale(0.95); }
  }

  .loader-text {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .loader-text span {
    font-size: 12px;
    font-weight: 400;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.35);
    animation: text-fade 1.4s ease-in-out infinite;
  }

  .dots {
    display: flex;
    gap: 6px;
  }

  .dots i {
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
    display: block;
    animation: dot-bounce 1.4s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.2s; }
  .dots i:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dot-bounce {
    0%, 80%, 100% { opacity: 0.3; transform: scale(1); }
    40%            { opacity: 1;   transform: scale(1.4); }
  }

  @keyframes text-fade {
    0%, 100% { opacity: 0.35; }
    50%       { opacity: 0.7; }
  }

  #app {
    min-height: 100vh;
    background: #0a0a0a;
    color: #fff;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  #app.visible { opacity: 1; }

  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }

  .nav-logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .nav-logo svg { width: 28px; height: 28px; color: #fff; }

  .nav-logo span {
    font-size: 15px;
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.02em;
  }

  .nav-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .badge {
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.04em;
  }

  .connect-btn {
    font-size: 12px;
    padding: 7px 16px;
    border-radius: 6px;
    background: #fff;
    color: #000;
    border: none;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.02em;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .stat {
    padding: 28px;
    background: #0a0a0a;
  }

  .stat-val {
    font-size: 28px;
    font-weight: 300;
    color: #fff;
    letter-spacing: -0.02em;
  }

  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.35);
    margin-top: 4px;
    letter-spacing: 0.06em;
  }

  .content {
    padding: 28px;
  }

  .section-title {
    font-size: 11px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .tx-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .tx-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .tx-hash {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    font-family: monospace;
    letter-spacing: 0.02em;
  }

  .tx-type {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
  }

  .tx-status {
    font-size: 11px;
    color: #4ade80;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce) {
    .logo, .dots i { animation: none; }
  }
</style>
</head>
<body>

<div id="loader">
  <div class="logo-wrap">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
      <path d="M 99,95 L 92,109 L 92,111 L 86,122 L 86,124 L 98,130 L 101,130 L 113,124 L 113,122 Z" fill="currentColor"/>
      <path d="M 107,28 L 107,77 L 132,128 L 130,132 L 109,142 L 174,167 Z" fill="currentColor"/>
      <path d="M 92,28 L 25,167 L 90,142 L 69,132 L 67,128 L 92,77 Z" fill="currentColor"/>
    </svg>
  </div>
  <div class="loader-text">
    <span>Loading Portal</span>
    <div class="dots">
      <i></i><i></i><i></i>
    </div>
  </div>
</div>

<div id="app">
  <nav>
    <div class="nav-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
        <path d="M 99,95 L 92,109 L 92,111 L 86,122 L 86,124 L 98,130 L 101,130 L 113,124 L 113,122 Z" fill="currentColor"/>
        <path d="M 107,28 L 107,77 L 132,128 L 130,132 L 109,142 L 174,167 Z" fill="currentColor"/>
        <path d="M 92,28 L 25,167 L 90,142 L 69,132 L 67,128 L 92,77 Z" fill="currentColor"/>
      </svg>
      <span>GenLayer</span>
    </div>
    <div class="nav-right">
      <span class="badge">Studionet · 61999</span>
      <button class="connect-btn">Connect Wallet</button>
    </div>
  </nav>

  <div class="stats">
    <div class="stat">
      <div class="stat-val">792,065</div>
      <div class="stat-label">Transactions</div>
    </div>
    <div class="stat">
      <div class="stat-val">20</div>
      <div class="stat-label">Validators</div>
    </div>
    <div class="stat">
      <div class="stat-val">139,243</div>
      <div class="stat-label">Contracts</div>
    </div>
  </div>

  <div class="content">
    <div class="section-title">Recent Transactions</div>
    <div class="tx-list">
      <div class="tx-row">
        <span class="tx-hash">0x7de7d2b0…a40f5</span>
        <span class="tx-type">Deploy</span>
        <span class="tx-status">Finalized</span>
      </div>
      <div class="tx-row">
        <span class="tx-hash">0xe6fd413a…2efaf</span>
        <span class="tx-type">Deploy</span>
        <span class="tx-status">Accepted</span>
      </div>
      <div class="tx-row">
        <span class="tx-hash">0x3a91bc2f…11d4c</span>
        <span class="tx-type">Call</span>
        <span class="tx-status">Finalized</span>
      </div>
      <div class="tx-row">
        <span class="tx-hash">0xf82c017e…9a3b1</span>
        <span class="tx-type">Call</span>
        <span class="tx-status">Finalized</span>
      </div>
      <div class="tx-row">
        <span class="tx-hash">0xc14d889a…55f20</span>
        <span class="tx-type">Deploy</span>
        <span class="tx-status">Accepted</span>
      </div>
    </div>
  </div>
</div>

<script>
  window.addEventListener('load', () => {
    setTimeout(() => {
      const loader = document.getElementById('loader');
      const app    = document.getElementById('app');
      loader.classList.add('hidden');
      setTimeout(() => app.classList.add('visible'), 200);
    }, 2800);
  });
</script>

</body>
</html>
